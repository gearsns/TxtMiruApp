<div id="container" class="inner hide">
  <header>
    <button data-action="regist">追加</button>
    <button data-action="delete" class="delete">削除</button>
    <button data-action="update" class="update">更新を確認</button>
    <button data-action="continue" class="goto">続きから</button>
    <button data-action="first" class="index">目次</button>
    <button data-action="close" class="blue">閉じる</button>
  </header>
  <div class="sticky_table">
    <div id="novel_list" class="novel_grid">
      <div class="grid_row header_row" style="--order: 9999">
        <div class="grid_th updated" name="new">
          New
        </div>
        <div class="grid_th">
          <div name="list_no">#</div>
        </div>
        <div name="page" class="grid_th">ページ</div>
        <div class="grid_th">
          <div name="title">タイトル</div>
          <div name="author">著者</div>
        </div>
        <div name="site" class="grid_th">掲載</div>
      </div>
    </div>
  </div>
</div>
