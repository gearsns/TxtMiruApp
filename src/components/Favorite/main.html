<div id="container" class="inner hide">
  <button data-action="regist">追加</button>
  <button data-action="delete" class="delete">削除</button>
  <button data-action="update" class="update">最新情報に更新</button>
  <button data-action="first" class="goto">トップから</button>
  <button data-action="continue" class="goto2">続きから</button>
  <button data-action="close" class="seigaiha_blue">閉じる</button>
  <div class="sticky_table">
    <table id="novel_list">
      <thead id="novel_list_head">
        <tr>
          <th>
            <div name="list_no">#</div>
          </th>
          <th colspan="3">
            <div name="page">ページ</div>
          </th>
          <th>
            <div name="title">
              <div name="new" class="updated" style="display:inline">New</div>タイトル
            </div>
            <div name="author">著者</div>
          </th>
          <th>
            <div name="site">掲載</div>
          </th>
        </tr>
      </thead>
      <tbody id="novel_list_body"></tbody>
    </table>
  </div>
</div>
